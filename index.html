<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 稿紙</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<style>
  /* ---------- 色彩：稿紙的綠格、墨色、印章紅 ---------- */
  :root {
    --desk:    #E6ECE8;
    --panel:   #F3F6F3;
    --paper:   #FDFEFB;
    --ink:     #1B2826;
    --muted:   #6A7A76;
    --line:    #CBD8D2;
    --grid:    #E2EBE6;
    --accent:  #1F6F66;
    --on-accent: #FFFFFF;
    --seal:    #C23B2E;
    --danger:  #B3342B;
    --select:  #BFE3DA;
    --shadow:  0 1px 2px rgba(27,40,38,.06), 0 8px 24px -12px rgba(27,40,38,.18);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --desk:    #0D1413;
    --panel:   #121B1A;
    --paper:   #182322;
    --ink:     #DDE8E4;
    --muted:   #8A9B96;
    --line:    #2A3B38;
    --grid:    #1F2E2C;
    --accent:  #5CC0B0;
    --on-accent: #08201C;
    --seal:    #D4503F;
    --danger:  #E5766A;
    --select:  #24504A;
    --shadow:  0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font-family: "Noto Sans TC", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
    font-size: 14px; color: var(--ink); background: var(--desk);
  }
  ::selection { background: var(--select); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- 頂欄 ---------- */
  header {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 14px; }
  .seal {
    width: 30px; height: 30px; border-radius: 3px; background: var(--seal); color: #fff;
    display: grid; place-items: center; transform: rotate(-4deg);
    font: 700 17px/1 "Noto Serif TC", serif;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.28);
  }
  .brand h1 { margin: 0; font: 600 17px/1 "Noto Serif TC", serif; letter-spacing: .06em; }

  .group { display: flex; gap: 2px; }
  .group + .group { margin-left: 8px; padding-left: 10px; border-left: 1px solid var(--line); }
  button {
    font: inherit; color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid transparent; border-radius: 6px; padding: 6px 11px;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--grid); }
  button.danger:hover { color: var(--danger); background: transparent; border-color: var(--danger); }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }

  .toggle {
    display: flex; align-items: center; gap: 7px; padding: 6px 10px; cursor: pointer;
    border-radius: 6px; user-select: none;
  }
  .toggle:hover { background: var(--grid); }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  .group.spacer { margin-left: auto; padding-left: 0; border-left: 0; }

  /* 檢視模式切換（分段按鈕） */
  .seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--desk); border: 1px solid var(--line); border-radius: 8px; }
  .seg button { padding: 4px 12px; }
  .seg button[aria-pressed="true"],
  .seg button[aria-pressed="true"]:hover {
    background: var(--paper); color: var(--accent); font-weight: 600;
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.08);
  }
  #btn-side { margin-left: 6px; }
  #btn-side[aria-pressed="false"] { color: var(--muted); }

  /* ---------- 主版面 ---------- */
  main {
    --side-w: 216px; --left: 500fr; --right: 500fr;
    flex: 1; display: grid; min-height: 0;
    grid-template-columns: var(--side-w) minmax(0,var(--left)) 9px minmax(0,var(--right));
  }
  main[data-side="off"] { --side-w: 0px; }
  main[data-side="off"] aside { visibility: hidden; border-right-width: 0; overflow: hidden; }
  /* 單一視窗模式：隱藏另一邊與分隔線 */
  main[data-view="md"], main[data-view="preview"] { grid-template-columns: var(--side-w) minmax(0,1fr); }
  main[data-view="md"] #preview, main[data-view="md"] #splitter,
  main[data-view="preview"] #editor, main[data-view="preview"] #splitter { display: none; }
  /* 純 Markdown 時，讓文字維持適合閱讀的行寬並置中 */
  main[data-view="md"] #editor { padding-inline: max(30px, calc((100vw - var(--side-w) - 900px) / 2)); }

  /* 可拖曳的分隔線 */
  #splitter { position: relative; cursor: col-resize; background: var(--panel); touch-action: none; }
  #splitter::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%);
    background: var(--line); transition: width .12s, background .12s;
  }
  #splitter::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 5px; height: 36px; transform: translate(-50%, -50%);
    border-radius: 3px; background: var(--line); border: 1px solid var(--panel); transition: background .12s;
  }
  #splitter:hover::before, #splitter:focus-visible::before, body.dragging #splitter::before { width: 3px; background: var(--accent); }
  #splitter:hover::after, #splitter:focus-visible::after, body.dragging #splitter::after { background: var(--accent); }
  #splitter:focus-visible { outline: none; }
  body.dragging { cursor: col-resize; user-select: none; }
  body.dragging textarea, body.dragging #preview { pointer-events: none; }

  aside { background: var(--desk); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .aside-top { padding: 12px; }
  .aside-top button { width: 100%; padding: 8px; }
  #doc-list { list-style: none; margin: 0; padding: 0 8px 12px; overflow: auto; flex: 1; }
  #doc-list li {
    position: relative; padding: 9px 12px 9px 16px; margin-bottom: 2px; border-radius: 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
  }
  #doc-list li:hover { background: var(--grid); }
  #doc-list li.active { background: var(--paper); box-shadow: 0 0 0 1px var(--line); }
  #doc-list li.active::before {
    content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--seal);
  }
  .doc-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-meta  { font-size: 12px; color: var(--muted); }

  #editor {
    border: 0; resize: none; outline: none; min-height: 0;
    padding: 28px 30px; background: var(--panel); color: var(--ink); caret-color: var(--accent);
    font: 14px/1.85 "JetBrains Mono", ui-monospace, Consolas, "Noto Sans Mono CJK TC", "Noto Sans TC", monospace;
    tab-size: 2;
  }
  #editor::placeholder { color: var(--muted); }

  #preview { overflow: auto; min-height: 0; background: var(--panel); padding: 24px 28px 48px; }

  /* 預覽：一張稿紙 */
  #sheet {
    max-width: 760px; margin: 0 auto; padding: 44px 56px 52px;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow);
    font: 400 16.5px/2 "Noto Serif TC", "Songti TC", serif;
    overflow-wrap: anywhere;
  }
  #sheet > :first-child { margin-top: 0; }
  #sheet > :last-child  { margin-bottom: 0; }
  #sheet h1, #sheet h2, #sheet h3, #sheet h4 { font-weight: 700; line-height: 1.5; letter-spacing: .02em; margin: 1.6em 0 .6em; }
  #sheet h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 2px solid var(--ink); }
  #sheet h2 { font-size: 1.5em; padding-bottom: .2em; border-bottom: 1px solid var(--line); }
  #sheet h3 { font-size: 1.2em; }
  #sheet h4 { font-size: 1em; color: var(--muted); }
  #sheet p, #sheet ul, #sheet ol, #sheet blockquote, #sheet pre, #sheet table { margin: 0 0 1em; }
  #sheet ul, #sheet ol { padding-left: 1.6em; }
  #sheet li::marker { color: var(--seal); }
  #sheet a { color: var(--accent); text-underline-offset: 3px; }
  #sheet hr { border: 0; height: 1px; background: var(--line); margin: 2em 0; }
  #sheet img { max-width: 100%; height: auto; }
  #sheet blockquote {
    padding: .1em 1.1em; color: var(--muted); background: color-mix(in srgb, var(--paper) 70%, transparent);
    border-left: 3px solid var(--accent);
  }
  #sheet code {
    font: 400 .86em "JetBrains Mono", ui-monospace, Consolas, monospace;
    background: var(--grid); padding: .12em .4em; border-radius: 4px;
  }
  #sheet pre { background: var(--panel); border: 1px solid var(--line); padding: 14px 18px; overflow: auto; border-radius: 4px; line-height: 1.7; }
  #sheet pre code { background: none; padding: 0; font-size: 13.5px; }
  /* 三線表 */
  #sheet table { border-collapse: collapse; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); display: block; overflow-x: auto; max-width: 100%; }
  #sheet th { border-bottom: 1px solid var(--ink); font-weight: 600; }
  #sheet th, #sheet td { padding: 6px 16px; text-align: left; line-height: 1.7; }
  #sheet .katex-display { overflow-x: auto; overflow-y: hidden; padding: .3em 0; }
  #sheet .katex { font-size: 1.08em; }
  #sheet input[type="checkbox"] { accent-color: var(--accent); margin-right: .45em; }

  /* ---------- 底欄 ---------- */
  footer {
    display: flex; justify-content: space-between; gap: 12px; padding: 5px 14px;
    font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line);
  }

  /* ---------- 窄螢幕 ---------- */
  @media (max-width: 900px) {
    header { gap: 2px 4px; padding: 6px 10px; }
    .group + .group, .group.spacer { margin-left: 0; padding-left: 0; border-left: 0; }
    .group.spacer { margin-left: auto; }
    button, .toggle { padding: 5px 8px; }
    main { display: flex; flex-direction: column; }
    #editor, #preview { flex: 1 1 0; min-height: 0; }
    #splitter { display: none !important; }
    main[data-view="md"] #editor { padding-inline: 16px; }
    main[data-side="off"] aside { display: none; }
    aside { flex: none; flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
    .aside-top { padding: 8px; flex: none; }
    .aside-top button { width: auto; }
    #doc-list { display: flex; gap: 4px; padding: 8px 8px 8px 0; overflow-x: auto; }
    #doc-list li { flex: none; max-width: 160px; margin: 0; }
    #editor { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    #preview { padding: 14px; }
    #sheet { padding: 24px 22px 30px; }
    .brand { margin-right: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- 列印／存成 PDF：只印出預覽的稿紙內容 ---------- */
  @media print {
    @page { margin: 18mm; }
    html, body { height: auto; background: #fff; }
    header, footer, aside, #editor, #splitter { display: none !important; }
    main { display: block !important; }
    #preview { display: block !important; overflow: visible; padding: 0; background: #fff; }
    #sheet {
      --ink: #111; --paper: #fff; --line: #ccc; --grid: #eee; --panel: #f6f6f6; --muted: #555;
      --accent: #1F6F66; --seal: #C23B2E;
      max-width: none; padding: 0; border: 0; box-shadow: none; background: #fff; color: #111;
    }
    #sheet pre, #sheet blockquote, #sheet table, #sheet .katex-display { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="seal" aria-hidden="true">稿</div>
    <h1>Markdown 稿紙</h1>
  </div>
  <div class="group" role="group" aria-label="檢視模式">
    <div class="seg">
      <button data-view="md" aria-pressed="false" title="只顯示 Markdown 原始碼">純 Markdown</button>
      <button data-view="split" aria-pressed="true" title="左右並排：原始碼與預覽">雙欄</button>
      <button data-view="preview" aria-pressed="false" title="只顯示預覽">純預覽</button>
    </div>
    <button id="btn-side" aria-pressed="true" title="顯示或隱藏左側文件列表">文件列表</button>
  </div>
  <div class="group">
    <button id="btn-rename">改名</button>
    <button id="btn-delete" class="danger">刪除</button>
  </div>
  <div class="group">
    <button id="btn-import">匯入 .md</button>
    <button id="btn-export">匯出 .md</button>
    <button id="btn-print" title="列印預覽內容，或在列印視窗選擇「另存為 PDF」">列印 / PDF</button>
  </div>
  <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden>
  <div class="group spacer">
    <label class="toggle" id="sync-label" title="開啟後，滑動其中一邊時另一邊會跟著捲動">
      <input type="checkbox" id="sync-scroll" checked> 同步捲動
    </label>
    <button id="btn-theme" title="切換淺色／深色">深色</button>
  </div>
</header>

<main id="main" data-view="split" data-side="on">
  <aside>
    <div class="aside-top"><button id="btn-new" class="primary">新增文件</button></div>
    <ul id="doc-list"></ul>
  </aside>
  <textarea id="editor" spellcheck="false" placeholder="在這裡輸入 Markdown，公式請用 $...$ 或 $$...$$"></textarea>
  <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="調整輸入區與預覽區的寬度（左右方向鍵微調，雙擊還原）"
       aria-valuemin="15" aria-valuemax="85" aria-valuenow="50"></div>
  <div id="preview"><article id="sheet"></article></div>
</main>

<footer>
  <span id="status">就緒</span>
  <span id="stats"></span>
</footer>

<script>
  if (window.marked) marked.setOptions({ gfm: true, breaks: true });

  const KEY = 'md-scratch-docs-v1';
  const $ = id => document.getElementById(id);
  const editor = $('editor'), preview = $('preview'), sheet = $('sheet'),
        list = $('doc-list'), statusEl = $('status'), statsEl = $('stats');

  /* ---------- 主題 ---------- */
  const THEME_KEY = 'md-scratch-theme';
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $('btn-theme').textContent = t === 'dark' ? '淺色' : '深色';
  }
  let theme;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme(theme);
  $('btn-theme').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  };

  /* ---------- 文件資料 ---------- */
  function makeDoc(content = '', title = '') {
    return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title, content, updated: Date.now() };
  }

  const WELCOME = `# 歡迎使用 Markdown 稿紙

左邊輸入，右邊即時預覽。內容會自動暫存在這個瀏覽器中。

## 數學公式

行內公式：質能方程式 $E = mc^2$，歐拉恆等式 $e^{i\\pi} + 1 = 0$。

獨立公式：

$$
\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}
$$

$$
\\nabla \\times \\mathbf{E} = -\\frac{\\partial \\mathbf{B}}{\\partial t}
$$

## 其他語法

| 項目 | 說明 |
| --- | --- |
| 表格 | 三線表樣式 |
| 程式碼 | 使用 \`\`\` 包起來 |

- [x] 可以勾選的待辦事項
- [ ] 用「匯出 .md」下載成檔案
`;

  function loadAll() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.docs) && s.docs.length && s.docs.some(d => d.id === s.currentId)) return s;
    } catch (e) {}
    const d = makeDoc(WELCOME);
    return { docs: [d], currentId: d.id };
  }

  let state = loadAll();
  const current = () => state.docs.find(d => d.id === state.currentId) || state.docs[0];

  function displayTitle(d) {
    if (d.title) return d.title;
    const line = (d.content.split('\n').find(l => l.trim()) || '').replace(/^#+\s*/, '').trim();
    return line.slice(0, 30) || '未命名';
  }

  function fmtTime(ts) {
    const d = new Date(ts), p = n => String(n).padStart(2, '0');
    return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      statusEl.textContent = '已儲存 ' + new Date().toLocaleTimeString();
    } catch (e) {
      statusEl.textContent = '無法儲存：瀏覽器空間不足或被封鎖，請先匯出 .md';
    }
  }

  let saveTimer;
  function scheduleSave() { statusEl.textContent = '編輯中…'; clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); }
  function flush() { clearTimeout(saveTimer); persist(); }

  /* ---------- 數學公式（KaTeX） ---------- */
  // 先把公式抽出來換成佔位符，避免被 Markdown 解析破壞（例如 _ 與 *），
  // 渲染並消毒 HTML 之後再放回去。程式碼區塊與行內程式碼不處理。
  const MATH_RE = /(```[\s\S]*?```|`[^`\n]+`)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?!\s)((?:\\.|[^$\\\n])+?)(?<!\s)\$/g;

  function renderMath(tex, display) {
    try {
      return katex.renderToString(tex.trim(), { displayMode: display, throwOnError: false, output: 'htmlAndMathml' });
    } catch (e) {
      const esc = String(tex).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      return `<code>${esc}</code>`;
    }
  }

  function renderMarkdown(src) {
    if (!window.marked) return '<p>Markdown 解析器載入失敗，請檢查網路連線後重新整理。</p>';
    const maths = [];
    let text = src;
    if (window.katex) {
      text = src.replace(MATH_RE, (m, code, d1, d2, i1, i2) => {
        if (code) return code;
        const display = d1 !== undefined || d2 !== undefined;
        const tex = d1 ?? d2 ?? i1 ?? i2;
        maths.push(renderMath(tex, display));
        return `MDMATHPH${maths.length - 1}X`;
      });
    }
    let html = marked.parse(text);
    html = window.DOMPurify ? DOMPurify.sanitize(html) : html;
    return html.replace(/MDMATHPH(\d+)X/g, (_, i) => maths[+i] ?? '');
  }

  /* ---------- 畫面 ---------- */
  function renderPreview() { sheet.innerHTML = renderMarkdown(current().content); }

  function renderStats() {
    const c = current().content;
    statsEl.textContent = `${c.replace(/\s/g, '').length} 字 ・ ${c ? c.split('\n').length : 0} 行`;
  }

  function renderList() {
    list.innerHTML = '';
    state.docs.forEach(d => {
      const li = document.createElement('li');
      li.tabIndex = 0;
      if (d.id === state.currentId) li.classList.add('active');
      const t = document.createElement('span'); t.className = 'doc-title'; t.textContent = displayTitle(d); t.title = t.textContent;
      const m = document.createElement('span'); m.className = 'doc-meta'; m.textContent = fmtTime(d.updated);
      li.append(t, m);
      const open = () => { flush(); state.currentId = d.id; render(); };
      li.onclick = open;
      li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
      list.appendChild(li);
    });
  }

  function render() {
    editor.value = current().content;
    renderPreview();
    renderList();
    renderStats();
    preview.scrollTop = 0;
    editor.scrollTop = 0;
  }

  editor.addEventListener('input', () => {
    const d = current();
    d.content = editor.value;
    d.updated = Date.now();
    renderPreview();
    renderList();
    renderStats();
    scheduleSave();
  });

  // Tab 鍵縮排（兩個空白）
  editor.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      insertText('  ');
    }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flush(); }
  });

  /* ---------- 按鈕 ---------- */
  $('btn-new').onclick = () => {
    flush();
    const d = makeDoc('');
    state.docs.unshift(d);
    state.currentId = d.id;
    render();
    editor.focus();
    flush();
  };

  $('btn-rename').onclick = () => {
    const d = current();
    const t = prompt('文件名稱：', displayTitle(d));
    if (t !== null) { d.title = t.trim(); renderList(); flush(); }
  };

  $('btn-delete').onclick = () => {
    const d = current();
    if (!confirm(`確定刪除「${displayTitle(d)}」？刪除後無法復原。`)) return;
    state.docs = state.docs.filter(x => x.id !== d.id);
    if (!state.docs.length) state.docs.push(makeDoc(''));
    state.currentId = state.docs[0].id;
    render();
    flush();
  };

  $('btn-export').onclick = () => {
    const d = current();
    const blob = new Blob([d.content], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = displayTitle(d).replace(/[\\/:*?"<>|]/g, '_') + '.md';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  $('btn-import').onclick = () => $('file-input').click();

  $('file-input').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    const text = await f.text();
    flush();
    const d = makeDoc(text, f.name.replace(/\.(md|markdown|txt)$/i, ''));
    state.docs.unshift(d);
    state.currentId = d.id;
    render();
    flush();
    e.target.value = '';
  };

  /* ---------- 同步捲動（依比例） ---------- */
  const syncBox = $('sync-scroll');
  const SYNC_KEY = 'md-scratch-sync-scroll';
  try { const v = localStorage.getItem(SYNC_KEY); if (v !== null) syncBox.checked = v === '1'; } catch (e) {}
  syncBox.addEventListener('change', () => {
    try { localStorage.setItem(SYNC_KEY, syncBox.checked ? '1' : '0'); } catch (e) {}
  });

  let syncing = false;
  function syncFrom(src, dst) {
    if (!syncBox.checked) return;
    if (syncing) { syncing = false; return; }
    const max = src.scrollHeight - src.clientHeight;
    const dmax = dst.scrollHeight - dst.clientHeight;
    if (max <= 0 || dmax <= 0) return;
    syncing = true;
    dst.scrollTop = (src.scrollTop / max) * dmax;
    requestAnimationFrame(() => { syncing = false; });
  }
  editor.addEventListener('scroll', () => syncFrom(editor, preview));
  preview.addEventListener('scroll', () => syncFrom(preview, editor));

  /* ---------- 在編輯區插入文字（保留復原紀錄） ---------- */
  function insertText(str) {
    editor.focus();
    if (!document.execCommand('insertText', false, str)) {
      editor.setRangeText(str, editor.selectionStart, editor.selectionEnd, 'end');
      editor.dispatchEvent(new Event('input'));
    }
  }

  function wrapSelection(open, close, placeholder) {
    const s = editor.selectionStart, e = editor.selectionEnd, v = editor.value, sel = v.slice(s, e);
    // 已經被包住就取消
    if (sel && v.slice(s - open.length, s) === open && v.slice(e, e + close.length) === close) {
      editor.setSelectionRange(s - open.length, e + close.length);
      insertText(sel);
      editor.setSelectionRange(s - open.length, s - open.length + sel.length);
      return;
    }
    const text = sel || placeholder;
    insertText(open + text + close);
    editor.setSelectionRange(s + open.length, s + open.length + text.length);
  }

  // Ctrl/Cmd + B 粗體、I 斜體、K 連結
  editor.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
    const k = e.key.toLowerCase();
    if (k === 'b') { e.preventDefault(); wrapSelection('**', '**', '粗體文字'); }
    else if (k === 'i') { e.preventDefault(); wrapSelection('*', '*', '斜體文字'); }
    else if (k === 'k') {
      e.preventDefault();
      const s = editor.selectionStart, sel = editor.value.slice(s, editor.selectionEnd), text = sel || '連結文字';
      insertText(`[${text}](網址)`);
      editor.setSelectionRange(s + text.length + 3, s + text.length + 5);
    }
  });

  /* ---------- 檢視模式、分隔線、文件列表 ---------- */
  const mainEl = $('main'), splitter = $('splitter'), syncLabel = $('sync-label');
  const UI_KEY = 'md-scratch-ui';
  let ui = { view: 'split', ratio: 0.5, side: true };
  try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY)) || {}); } catch (e) {}
  if (!['md', 'split', 'preview'].includes(ui.view)) ui.view = 'split';
  ui.ratio = Math.min(0.85, Math.max(0.15, Number(ui.ratio) || 0.5));
  ui.side = ui.side !== false;

  function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} }

  function applyUI() {
    mainEl.dataset.view = ui.view;
    mainEl.dataset.side = ui.side ? 'on' : 'off';
    const l = Math.round(ui.ratio * 1000);
    mainEl.style.setProperty('--left', l + 'fr');
    mainEl.style.setProperty('--right', (1000 - l) + 'fr');
    splitter.setAttribute('aria-valuenow', Math.round(ui.ratio * 100));
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === ui.view)));
    const sideBtn = $('btn-side');
    sideBtn.setAttribute('aria-pressed', String(ui.side));
    sideBtn.textContent = ui.side ? '隱藏列表' : '顯示列表';
    syncLabel.style.display = ui.view === 'split' ? '' : 'none';
  }

  function setView(view) {
    if (view === ui.view) return;
    // 從單一視窗切換時，讓新出現的視窗停在相同的閱讀位置
    const src = ui.view === 'md' ? editor : ui.view === 'preview' ? preview : null;
    const ratio = src && src.scrollHeight > src.clientHeight ? src.scrollTop / (src.scrollHeight - src.clientHeight) : null;
    ui.view = view;
    applyUI();
    saveUI();
    if (ratio !== null) {
      requestAnimationFrame(() => {
        [editor, preview].forEach(el => {
          if (el.offsetParent !== null) el.scrollTop = ratio * (el.scrollHeight - el.clientHeight);
        });
      });
    }
  }

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  $('btn-side').addEventListener('click', () => { ui.side = !ui.side; applyUI(); saveUI(); });
  $('btn-print').addEventListener('click', () => window.print());

  // 拖曳分隔線調整寬度
  function ratioFromPointer(x) {
    const l = editor.getBoundingClientRect().left, r = preview.getBoundingClientRect().right;
    const panes = (r - l) - splitter.offsetWidth;
    if (panes <= 0) return ui.ratio;
    return Math.min(0.85, Math.max(0.15, (x - splitter.offsetWidth / 2 - l) / panes));
  }
  splitter.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    splitter.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    e.preventDefault();
  });
  splitter.addEventListener('pointermove', e => {
    if (!document.body.classList.contains('dragging')) return;
    ui.ratio = ratioFromPointer(e.clientX);
    applyUI();
  });
  const endDrag = () => {
    if (!document.body.classList.contains('dragging')) return;
    document.body.classList.remove('dragging');
    saveUI();
  };
  splitter.addEventListener('pointerup', endDrag);
  splitter.addEventListener('pointercancel', endDrag);
  splitter.addEventListener('lostpointercapture', endDrag);
  splitter.addEventListener('dblclick', () => { ui.ratio = 0.5; applyUI(); saveUI(); });
  splitter.addEventListener('keydown', e => {
    const step = e.shiftKey ? 0.1 : 0.02;
    if (e.key === 'ArrowLeft') ui.ratio = Math.max(0.15, ui.ratio - step);
    else if (e.key === 'ArrowRight') ui.ratio = Math.min(0.85, ui.ratio + step);
    else if (e.key === 'Home') ui.ratio = 0.5;
    else return;
    e.preventDefault();
    applyUI();
    saveUI();
  });

  applyUI();
  render();
</script>
</body>
</html>
